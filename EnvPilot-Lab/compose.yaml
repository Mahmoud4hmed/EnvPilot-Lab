name: ${LAB_PROJECT:-envpilot-lab}
x-backend: &backend
  image: envpilot-backend:local
  build: ./backend
  environment: &backend-env
    DB_HOST: db
    BROKER_URL: redis://redis:6379/0
    PROVIDER_URL: http://provider:9000
  volumes:
    - ./backend:/app
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
    provider: {condition: service_healthy}
services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: envpilot
      POSTGRES_USER: envpilot
      POSTGRES_PASSWORD: envpilot
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U envpilot]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  redis:
    image: redis:7.4.11-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [broker:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 128m
  provider:
    build: ./provider
    volumes: [provider-data:/data]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 128m
  api:
    <<: *backend
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  worker:
    <<: *backend
    command: [celery, -A, config, worker, -l, INFO, --concurrency=2, -Q, provision]
    mem_limit: 512m
  web:
    build: ./frontend
    environment:
      WATCHPACK_POLLING: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/tests:/app/tests
    mem_limit: 1536m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 60s
      retries: 12
  proxy:
    image: nginx:1.30.6-alpine
    ports: ['127.0.0.1:${LAB_PORT:-8090}:80']
    volumes: ['./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    mem_limit: 128m
  ansible:
    build: ./ansible
    profiles: [tools]
    volumes: ['./ansible:/work', 'ansible-fixture:/fixture']
    working_dir: /work
  browser-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile.browser
    profiles: [tools]
    environment:
      BASE_URL: http://proxy
    depends_on: [proxy]
volumes:
  database:
  broker:
  provider-data:
  ansible-fixture:
